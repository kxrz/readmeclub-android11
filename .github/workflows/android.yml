name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Release without pushing a tag: Actions → Android → Run workflow, on main, with the version.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in versionName (e.g. 1.0.6). Creates the tag v<version>."
        required: true

jobs:
  debug:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # assembleRelease (unsigned here) catches R8/lint-vital problems before a release tag does.
      - run: ./gradlew testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A pushed tag, or the tag the manual run creates (the release step creates it on this commit).
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the version matches the code
        run: |
          code="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "v$code" != "${TAG%%-*}" ]; then echo "::error::$TAG does not match versionName $code"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk readmeclub.apk
          cp readmeclub.apk "readmeclub-${TAG#v}.apk"
          # Release notes come from CHANGELOG.md; no section for this version = no release.
          version="${TAG#v}"; version="${version%%-*}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
          # Read by the app's updater: version, APK of this exact release, checksum to verify it,
          # and the release notes to show before updating.
          jq -n \
            --arg version "${TAG#v}" \
            --arg apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/readmeclub.apk" \
            --arg sha "$(sha256sum readmeclub.apk | cut -d' ' -f1)" \
            --rawfile notes release-notes.md \
            '{latestVersion: $version, apkUrl: $apk, sha256: $sha, notes: $notes}' > manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            readmeclub.apk
            readmeclub-*.apk
            manifest.json
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          # A tag like v1.0.0-rc1 is a test build, not a version to distribute.
          prerelease: ${{ contains(env.TAG, '-') }}
