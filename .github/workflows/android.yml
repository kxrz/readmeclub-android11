name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # assembleRelease (unsigned here) catches R8/lint-vital problems before a release tag does.
      - run: ./gradlew testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk readmeclub.apk
          cp readmeclub.apk "readmeclub-${GITHUB_REF_NAME#v}.apk"
          # Read by the app's updater: version, APK of this exact release, checksum to verify it.
          cat > manifest.json <<EOF
          {
            "latestVersion": "${GITHUB_REF_NAME#v}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/readmeclub.apk",
            "sha256": "$(sha256sum readmeclub.apk | cut -d' ' -f1)"
          }
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            readmeclub.apk
            readmeclub-*.apk
            manifest.json
          generate_release_notes: true
          # A tag like v1.0.0-rc1 is a test build, not a version to distribute.
          prerelease: ${{ contains(github.ref_name, '-') }}
