name: Screenshots

# Tours every screen of the debug build on an Android 11 emulator set up like a reader and
# pushes the PNGs to a branch: the Xteink S4 (480 x 800 px, 220 dpi) to `screenshots`, a large
# reader (the Supernote Nomad, 1404 x 1872 px, 300 dpi) to `screenshots-large`.
# Actions → Screenshots → Run workflow, then pick the screen.
on:
  workflow_dispatch:
    inputs:
      screen:
        description: "Screen to emulate"
        type: choice
        options: ["s4", "large"]
        default: "s4"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIZE: ${{ inputs.screen == 'large' && '1404x1872' || '480x800' }}
      DENSITY: ${{ inputs.screen == 'large' && '300' || '220' }}
      BRANCH: ${{ inputs.screen == 'large' && 'screenshots-large' || 'screenshots' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Screens as readers see them: the debug build, under the release name and version.
      - name: Build
        run: |
          sed -i 's/readme.club dev/readme.club/' app/src/debug/res/values/strings.xml
          sed -i '/versionNameSuffix = "-debug"/d' app/build.gradle.kts
          ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          # Android refuses a forced size over twice the emulator's own screen (320 x 640):
          # the large reader gets an emulator built at its size.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ inputs.screen == 'large' && '-skin 1404x1872' || '' }}
          script: |
            adb shell wm size $SIZE
            adb shell wm density $DENSITY
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/screenshots.py shots
      - name: Push to the screenshots branch
        run: |
          cd shots
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Screenshots of ${GITHUB_SHA::7} ($SIZE)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$BRANCH"
